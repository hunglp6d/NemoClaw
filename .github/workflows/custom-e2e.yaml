# Validation workflow for fix/nightly-e2e-agent-turn-latency-model-unavail-2b68caa
# Re-runs only the agent-turn-latency-e2e job to confirm the model switch fixes the failure.

name: custom-e2e

on:
  push:
    branches:
      - fix/nightly-e2e-agent-turn-latency-model-unavail-2b68caa-custom-e2e

permissions:
  contents: read

concurrency:
  group: custom-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-turn-latency-e2e:
    if: github.repository == 'hunglp6d/NemoClaw'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Run E2E script
        env:
          NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
          NEMOCLAW_NON_INTERACTIVE: "1"
          NEMOCLAW_RECREATE_SANDBOX: "1"
          NEMOCLAW_TURN_LATENCY_MODEL: "nvidia/nemotron-3-super-120b-a12b"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash test/e2e/test-agent-turn-latency-e2e.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-turn-latency-logs
          path: |
            /tmp/nemoclaw-e2e-openclaw-turn-latency-install.log
            /tmp/nemoclaw-e2e-hermes-turn-latency-install.log
            /tmp/nemoclaw-e2e-agent-turn-latency.json
          if-no-files-found: ignore

# Validation workflow for fix/nightly-e2e-tmux-fork-seccomp-451f26f
# Runs only sandbox-operations-e2e to validate the tmux seccomp tolerance fix.

name: custom-e2e

on:
  push:
    branches: ['fix/nightly-e2e-tmux-fork-seccomp-451f26f-custom-e2e']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-e2e-tmux-seccomp-${{ github.sha }}
  cancel-in-progress: true

jobs:
  sandbox-operations-e2e:
    if: github.repository == 'hunglp6d/NemoClaw'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Start gateway log streamer (background)
        run: |
          mkdir -p docker-logs
          nohup bash -c '
            export PATH="$HOME/.local/bin:$PATH"
            while sleep 5; do
              if ! docker ps --format "{{.Names}}" 2>/dev/null | grep -q "^openshell-cluster-nemoclaw$"; then
                continue
              fi
              docker exec openshell-cluster-nemoclaw kubectl get pods -A --no-headers >docker-logs/_pods.txt 2>&1
              registry="$HOME/.nemoclaw/sandboxes.json"
              [ -f "$registry" ] || continue
              live=$(jq -r ".sandboxes // {} | keys[]?" "$registry" 2>/dev/null)
              for name in $live; do
                case "$name" in *[!a-z0-9_-]*|"") continue ;; esac
                pod_match=$(awk -v n="$name" "\$1==n || \$2==n {print \$1\"/\"\$2; exit}" docker-logs/_pods.txt)
                if [ -z "$pod_match" ]; then continue; fi
                pod_ns="${pod_match%%/*}"
                pod_name="${pod_match##*/}"
                docker exec openshell-cluster-nemoclaw kubectl exec -n "$pod_ns" "$pod_name" -- bash -c "
                  for f in /sandbox/.openclaw/logs/gateway-persistent.log /tmp/gateway.log; do
                    [ -f \"\$f\" ] || continue
                    printf \"\\n----- %s -----\\n\" \"\$f\"
                    cat -- \"\$f\" 2>/dev/null
                  done
                " > "docker-logs/sandbox-${name}.log" 2>&1
              done
            done
          ' >/dev/null 2>&1 &
          echo $! > /tmp/gateway-log-streamer.pid

      - name: Run sandbox operations E2E test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NEMOCLAW_NON_INTERACTIVE: "1"
          NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
          NEMOCLAW_POLICY_TIER: "open"
          GITHUB_TOKEN: ${{ github.token }}
          NEMOCLAW_E2E_TIMEOUT_SECONDS: "2700"
        run: bash test/e2e/test-sandbox-operations.sh

      - name: Stop gateway log streamer
        if: always()
        run: |
          [ -f /tmp/gateway-log-streamer.pid ] && kill "$(cat /tmp/gateway-log-streamer.pid)" 2>/dev/null || true

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-ops-docker-logs
          path: docker-logs/
          if-no-files-found: ignore
